name: Pages
on:
  push:
    branches: [main]
    paths: ['ui/**', 'docs/teardown/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: {group: pages, cancel-in-progress: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/demo _site/teardown
          cp -r ui/* _site/demo/
          cp docs/teardown/index.html _site/teardown/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Rackbook</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/CrianeZRX/rackbook">
          <a href="https://github.com/CrianeZRX/rackbook">Rackbook on GitHub</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
